name: Build

on:
  push:
    branches:
      - "dev"
      - "release-*"
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"
      - "COPYING.md"

      # Workflows
      - ".github/workflows/build.yml"
      - ".github/actions/package/**"
      - ".github/actions/setup-dependencies/**"
  pull_request:
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"
      - "COPYING.md"

      # Workflows
      - ".github/workflows/build.yml"
      - ".github/actions/package/**"
      - ".github/actions/setup-dependencies/**"
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC (standard)
          - os: ubuntu-22.04
            artifact-name: Linux
            base-cmake-preset: linux

          # Linux - GCC + LTO
          - os: ubuntu-22.04
            artifact-name: Linux+LTO
            base-cmake-preset: linux
            enable-lto: true

          # Linux - Clang
          - os: ubuntu-22.04
            artifact-name: Linux-Clang
            base-cmake-preset: linux
            use-clang: true

          # Linux ARM
          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            base-cmake-preset: linux

          # Linux ARM + LTO
          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64+LTO
            base-cmake-preset: linux
            enable-lto: true

          # Windows MinGW (standard)
          - os: windows-2022
            artifact-name: Windows-MinGW-w64
            base-cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86

          # Windows MinGW + LTO
          - os: windows-2022
            artifact-name: Windows-MinGW-w64+LTO
            base-cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            enable-lto: true

          # Windows MinGW ARM
          - os: windows-11-arm
            artifact-name: Windows-MinGW-arm64
            base-cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64

          # Windows MinGW ARM + LTO
          - os: windows-11-arm
            artifact-name: Windows-MinGW-arm64+LTO
            base-cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64
            enable-lto: true

          # Windows MSVC (standard)
          - os: windows-2022
            artifact-name: Windows-MSVC
            base-cmake-preset: windows_msvc
            vcvars-arch: amd64

          # Windows MSVC + LTO
          - os: windows-2022
            artifact-name: Windows-MSVC+LTO
            base-cmake-preset: windows_msvc
            vcvars-arch: amd64
            enable-lto: true

          # Windows MSVC ARM64
          - os: windows-2022
            artifact-name: Windows-MSVC-arm64
            base-cmake-preset: windows_msvc_arm64_cross
            vcvars-arch: amd64_arm64
            qt-architecture: win64_msvc2022_arm64_cross_compiled

          # Windows MSVC ARM64 + LTO
          - os: windows-2022
            artifact-name: Windows-MSVC-arm64+LTO
            base-cmake-preset: windows_msvc_arm64_cross
            vcvars-arch: amd64_arm64
            qt-architecture: win64_msvc2022_arm64_cross_compiled
            enable-lto: true

          # Windows Clang
          - os: windows-2022
            artifact-name: Windows-Clang
            base-cmake-preset: windows_msvc
            vcvars-arch: amd64
            use-clang: true

          # Windows Clang + LTO
          - os: windows-2022
            artifact-name: Windows-Clang+LTO
            base-cmake-preset: windows_msvc
            vcvars-arch: amd64
            use-clang: true
            enable-lto: true

          # macOS (standard)
          - os: macos-14
            artifact-name: macOS
            base-cmake-preset: ${{ (inputs.build-type || 'Debug') == 'Debug' && 'macos_universal' || 'macos' }}
            macosx-deployment-target: 12.0

          # macOS + LTO
          - os: macos-14
            artifact-name: macOS+LTO
            base-cmake-preset: ${{ (inputs.build-type || 'Debug') == 'Debug' && 'macos_universal' || 'macos' }}
            macosx-deployment-target: 12.0
            enable-lto: true

    runs-on: ${{ matrix.os }}

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Clang (Linux)
        if: ${{ runner.os == 'Linux' && matrix.use-clang }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ inputs.build-type || 'Debug' }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-architecture: ${{ matrix.qt-architecture }}
        env:
          CC: ${{ matrix.use-clang && runner.os == 'Linux' && 'clang-18' || '' }}
          CXX: ${{ matrix.use-clang && runner.os == 'Linux' && 'clang++-18' || '' }}

      - name: Export CurseForge API Key
        run: echo "CURSEFORGE_API_KEY=${{ secrets.CURSEFORGE_API_KEY }}" >> $GITHUB_ENV

      - name: Export MSA Client ID
        run: echo "MSA_CLIENT_ID=${{ secrets.MSA_CLIENT_ID }}" >> $GITHUB_ENV

      ##
      # BUILD
      ##

      - name: Get CMake preset
        id: cmake-preset
        shell: bash
        env:
          BASE_CMAKE_PRESET: ${{ matrix.base-cmake-preset }}
          PRESET_TYPE: ${{ (inputs.build-type || 'Debug') == 'Debug' && 'debug' || 'ci' }}
          MSYSTEM: ${{ matrix.msystem }}
        run: |
          echo preset="$BASE_CMAKE_PRESET"_"$PRESET_TYPE" >> "$GITHUB_OUTPUT"

      - name: Configure CMake with optimizations (Windows MSVC)
        if: ${{ runner.os == 'Windows' && (matrix.base-cmake-preset == 'windows_msvc' || matrix.base-cmake-preset == 'windows_msvc_arm64_cross') }}
        shell: cmd
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ENABLE_LTO: ${{ matrix.enable-lto || 'false' }}
          USE_CLANG: ${{ matrix.use-clang || 'false' }}
        run: |
          set "CMAKE_EXTRA_FLAGS="
          if "%ENABLE_LTO%"=="true" set "CMAKE_EXTRA_FLAGS=-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
          if "%USE_CLANG%"=="true" (
            set "CC=clang-cl"
            set "CXX=clang-cl"
          )
          if defined VSINSTALLDIR (
            call "%VSINSTALLDIR%VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars-arch }}
          ) else (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars-arch }}
          )
          cmake --preset "%CMAKE_PRESET%" %CMAKE_EXTRA_FLAGS%

      - name: Configure CMake with optimizations (MinGW)
        if: ${{ runner.os == 'Windows' && matrix.msystem != '' }}
        shell: msys2 {0}
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ENABLE_LTO: ${{ matrix.enable-lto || 'false' }}
          USE_CLANG: ${{ matrix.use-clang || 'false' }}
        run: |
          CMAKE_EXTRA_FLAGS=""

          if [ "$ENABLE_LTO" = "true" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
          fi

          cmake --preset "$CMAKE_PRESET" $CMAKE_EXTRA_FLAGS

      - name: Configure CMake with optimizations (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ENABLE_LTO: ${{ matrix.enable-lto || 'false' }}
          USE_CLANG: ${{ matrix.use-clang || 'false' }}
        run: |
          CMAKE_EXTRA_FLAGS=""

          if [ "$ENABLE_LTO" = "true" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
          fi

          if [ "$USE_CLANG" = "true" ] && [ "${{ runner.os }}" = "Linux" ]; then
            export CC=clang-18
            export CXX=clang++-18
            CMAKE_EXTRA_FLAGS="$CMAKE_EXTRA_FLAGS -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld-18"
          fi

          cmake --preset "$CMAKE_PRESET" $CMAKE_EXTRA_FLAGS

      - name: Build (Windows MSVC)
        if: ${{ runner.os == 'Windows' && (matrix.base-cmake-preset == 'windows_msvc' || matrix.base-cmake-preset == 'windows_msvc_arm64_cross') }}
        shell: cmd
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
          BUILD_PLATFORM: official
        run: |
          if defined VSINSTALLDIR (
            call "%VSINSTALLDIR%VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars-arch }}
          ) else (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars-arch }}
          )
          REM Verify compiler is available
          cl.exe /? >nul 2>&1 || (echo ERROR: cl.exe not found after vcvars & exit /b 1)
          cmake --build --preset "%CMAKE_PRESET%" --target all
          REM Build updater explicitly (may be EXCLUDE_FROM_ALL)
          cmake --build --preset "%CMAKE_PRESET%" --target NMCLauncher_updater || (echo Updater target not available & exit /b 0)

      - name: Build (MinGW)
        if: ${{ runner.os == 'Windows' && matrix.msystem != '' }}
        shell: msys2 {0}
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
          BUILD_PLATFORM: official
        run: |
          cmake --build --preset "$CMAKE_PRESET" --target all
          # Build updater explicitly (may be EXCLUDE_FROM_ALL)
          cmake --build --preset "$CMAKE_PRESET" --target NMCLauncher_updater || true

      - name: Build (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
          BUILD_PLATFORM: official
        run: |
          cmake --build --preset "$CMAKE_PRESET" --target all

      - name: Test (Windows MSVC)
        if: ${{ runner.os == 'Windows' && (matrix.base-cmake-preset == 'windows_msvc' || matrix.base-cmake-preset == 'windows_msvc_arm64_cross') }}
        shell: cmd
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
        run: |
          if defined VSINSTALLDIR (
            call "%VSINSTALLDIR%VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars-arch }}
          ) else (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars-arch }}
          )
          ctest --preset "%CMAKE_PRESET%" || exit 0

      - name: Test (MinGW)
        if: ${{ runner.os == 'Windows' && matrix.msystem != '' }}
        shell: msys2 {0}
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
        run: |
          ctest --preset "$CMAKE_PRESET" || true

      - name: Test (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
        run: |
          ctest --preset "$CMAKE_PRESET" || true

      - name: Install (Windows MSVC)
        if: ${{ runner.os == 'Windows' && (matrix.base-cmake-preset == 'windows_msvc' || matrix.base-cmake-preset == 'windows_msvc_arm64_cross') }}
        shell: cmd
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
        run: |
          cmake --install build --prefix install

      - name: Install (MinGW)
        if: ${{ runner.os == 'Windows' && matrix.msystem != '' }}
        shell: msys2 {0}
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
        run: |
          cmake --install build --prefix install

      - name: Install (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
        run: |
          cmake --install build --prefix install

      ##
      # PACKAGE
      ##

      - name: Get short version (MinGW)
        if: ${{ runner.os == 'Windows' && matrix.msystem != '' }}
        id: short-version-mingw
        shell: msys2 {0}
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get short version (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        id: short-version-unix
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set version output
        id: short-version
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ -n "${{ matrix.msystem }}" ]; then
            echo "version=${{ steps.short-version-mingw.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.short-version-unix.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          cmake-preset: ${{ steps.cmake-preset.outputs.preset }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

          apple-codesign-cert: ${{ secrets.APPLE-CODESIGN-CERT }}
          apple-codesign-password: ${{ secrets.APPLE-CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE-CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE-NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE-ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          windows-codesign-cert: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          windows-codesign-password: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
